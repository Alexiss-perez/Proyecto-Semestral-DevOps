apiVersion: apps/v1
kind: Deployment
metadata:
  name: innovatech-ventas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: innovatech-ventas
  template:
    metadata:
      labels:
        app: innovatech-ventas
    spec:
      containers:
        - name: ventas
          image: innovatech-ventas:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: db-secret
---
apiVersion: v1
kind: Service
metadata:
  name: innovatech-ventas-service
spec:
  type: ClusterIP
  selector:
    app: innovatech-ventas
  ports:
    - port: 8080
      targetPort: 8080
