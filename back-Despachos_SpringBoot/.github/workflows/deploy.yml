name: Deploy Backend Despachos

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO

    steps:
    - name: Checkout del codigo
      uses: actions/checkout@v3

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Compilar proyecto con Maven
      run: mvn clean package -DskipTests

    - name: Iniciar sesion en Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Construir y subir imagen Docker
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/back-despachos:latest .
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/back-despachos:latest

    - name: Desplegar en Servidor AWS EC2 via SSH
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          docker stop back-despachos || true
          docker rm back-despachos || true
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/back-despachos:latest
          docker run -d --name back-despachos -p 8081:8081 ${{ secrets.DOCKERHUB_USERNAME }}/back-despachos:latest